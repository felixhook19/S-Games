plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.clutchgolf.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.clutchgolf.game"
        minSdk 26          // Android 8.0+
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // debug APK is unsigned-by-debug-key and installable directly
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Single source of truth: copy the game HTML from the repo root into the
// app's assets as index.html before every build. Edit clutch-golf.html only.
def copyGame = tasks.register('copyGame', Copy) {
    from rootProject.file('../clutch-golf.html')
    into layout.projectDirectory.dir('src/main/assets')
    rename { 'index.html' }
}
tasks.named('preBuild').configure { dependsOn copyGame }
