name: Build Clutch Golf APK

# Builds the installable Clutch Golf Android APK. Runs on pushes that touch the
# game (on the development branch) and can be started by hand from the Actions
# tab (Run workflow).
on:
  push:
    branches:
      - claude/new-session-j7j23b
    paths:
      - 'clutch-golf.html'
      - 'android-golf/**'
      - '.github/workflows/android-golf.yml'
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a Release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Build the debug APK
        working-directory: android-golf
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename the APK
        run: |
          mkdir -p out
          cp android-golf/app/build/outputs/apk/debug/app-debug.apk out/clutch-golf.apk
          ls -la out

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clutch-golf-apk
          path: out/clutch-golf.apk
          if-no-files-found: error

      # Also publish to a Release so it has a stable download link you can open
      # on a phone/computer without digging into the Actions UI.
      - name: Publish the APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: clutch-golf-latest
          name: Clutch Golf (latest APK)
          body: |
            The latest build of Clutch Golf.

            Download **clutch-golf.apk**, copy it to the phone, and tap it to
            install (you may need to allow "Install unknown apps" once). The app
            is fully offline and requests no permissions.
          files: out/clutch-golf.apk
          fail_on_unmatched_files: true
